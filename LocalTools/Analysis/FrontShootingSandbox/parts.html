<!doctype html>

<style>
.part a[download]{padding:3px 7px;font-size:11px;border:1px solid #60747e;border-radius:4px;text-decoration:none;background:#293b44}
*{box-sizing:border-box}body{margin:0;color:#ecf1f2;background:#202c34;font:14px system-ui,sans-serif;letter-spacing:0}header{height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid #4b5a62;background:#141c21}h1{font-size:16px;margin:0}a{color:#94caca}button,select{font:inherit;color:inherit;background:#293b44;border:1px solid #60747e;border-radius:4px;padding:6px 10px}button{cursor:pointer}nav{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding:10px 18px;border-bottom:1px solid #4b5a62}label{display:flex;gap:7px;align-items:center}main{display:grid;grid-template-columns:minmax(320px,42%) 1fr;min-height:0}.source{padding:14px;border-right:1px solid #4b5a62}h2{font-size:13px;margin:0 0 8px;color:#b9cbd1}.source canvas{display:block;width:100%;aspect-ratio:420/560;background:#293a44}.parts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0}.part{margin:0;padding:14px;border-bottom:1px solid #4b5a62;border-right:1px solid #4b5a62;min-width:0}.part canvas{width:100%;aspect-ratio:1;display:block;background-color:#31444d;background-image:conic-gradient(#354952 25%,transparent 0 50%,#354952 0 75%,transparent 0);background-size:20px 20px}.part figcaption{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:8px;font-size:12px}.part button{padding:3px 7px;font-size:11px}.part output{display:block;font-size:11px;color:#acbfc8;margin-top:6px;font-variant-numeric:tabular-nums}footer{display:flex;gap:24px;flex-wrap:wrap;padding:12px 18px;background:#141c21;font-size:12px;color:#b4c9d0}output[data-ok=true]{color:#80d1b4}#status{padding:12px 18px}input{accent-color:#53b4ac}button:disabled{opacity:.4}@media(max-width:850px){main{grid-template-columns:1fr}.source{border-right:0}.source canvas{max-height:540px;object-fit:contain}.parts{grid-template-columns:repeat(2,minmax(0,1fr))}nav{gap:12px;font-size:12px}header h1{font-size:14px}}
</style></head><body>
